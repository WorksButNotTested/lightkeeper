name: Ghidra Extension Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        # The change log is built from the history back to the previous tag.
        fetch-depth: 0

    - name: Resolve the latest Ghidra release
      id: ghidra
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        release=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
          https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest)

        # e.g. https://github.com/.../download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
        url=$(jq -r '.assets[].browser_download_url
                     | select(test("/ghidra_.*_PUBLIC_[0-9]+\\.zip$"))' <<<"${release}" | head -1)

        if [ -z "${url}" ]; then
          echo "::error::No Ghidra distribution found in the latest release:"
          jq -r '.assets[].name' <<<"${release}"
          exit 1
        fi

        zip=${url##*/}
        # ghidra_12.1.3_PUBLIC_20260817.zip unpacks to the directory ghidra_12.1.3_PUBLIC
        base=${zip%.zip}
        dir=${base%_*}
        version=$(sed -E 's/^ghidra_([0-9.]+)_PUBLIC.*/\1/' <<<"${zip}")

        {
          echo "url=${url}"
          echo "zip=${zip}"
          echo "dir=${dir}"
          echo "version=${version}"
        } >> "${GITHUB_OUTPUT}"

        echo "Building against Ghidra ${version} (${zip})"

    - name: Download Ghidra release
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "${{ steps.ghidra.outputs.zip }}" "${{ steps.ghidra.outputs.url }}"
        unzip -qq "${{ steps.ghidra.outputs.zip }}" -d /opt
        rm -v "${{ steps.ghidra.outputs.zip }}"

    - name: Get the required Java version
      id: get_java
      shell: bash
      run: |
        set -euo pipefail

        properties=/opt/${{ steps.ghidra.outputs.dir }}/Ghidra/application.properties
        version=$(sed -n 's/^application\.java\.compiler=//p' "${properties}")
        [ -n "${version}" ] || version=$(sed -n 's/^application\.java\.min=//p' "${properties}")
        [ -n "${version}" ] || version=21

        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "Ghidra ${{ steps.ghidra.outputs.version }} builds with Java ${version}"

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ steps.get_java.outputs.version }}
        cache: 'gradle'

    - name: Build
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        cd lightkeeper
        java --version
        gradle -PGHIDRA_INSTALL_DIR=/opt/${{ steps.ghidra.outputs.dir }}
        mv -v dist/*.zip "${GITHUB_WORKSPACE}/lightkeeper-${TAG}.zip"

    - name: Write the release notes
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        GHIDRA_VERSION: ${{ steps.ghidra.outputs.version }}
      run: |
        set -euo pipefail

        previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
        if [ -n "${previous}" ]; then
          range="${previous}..${TAG}"
        else
          range="${TAG}"
        fi

        {
          echo "Built against Ghidra ${GHIDRA_VERSION}."
          echo
          echo "Change log:"
          git log --pretty=format:'* %s' "${range}"
          echo
        } > "${GITHUB_WORKSPACE}/release-notes.md"

        cat "${GITHUB_WORKSPACE}/release-notes.md"

    - name: Publish the release
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh release create "${TAG}" \
          --title "Release ${TAG}" \
          --notes-file "${GITHUB_WORKSPACE}/release-notes.md" \
          "${GITHUB_WORKSPACE}/lightkeeper-${TAG}.zip"
