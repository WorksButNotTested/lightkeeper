
name: Ghidra Extension Publish

env:
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_ZIP: ghidra_12.2_PUBLIC_20261016.zip
  GHIDRA_DIR: ghidra_12.2_PUBLIC

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Get the version and changelog
        id: get_version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGE_LOG="$(git log --pretty=format:'* %s' "${PREVIOUS_TAG}..${GITHUB_SHA}")"
          else
            CHANGE_LOG="$(git log --pretty=format:'* %s' "${GITHUB_SHA}")"
          fi

          {
            echo "VERSION=$VERSION"
            echo "CHANGE_LOG<<EOF"
            printf '%s\n' "$CHANGE_LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Ghidra
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$GHIDRA_ZIP" \
            "$GHIDRA_URL"

      - name: Build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ghidra"

          unzip -qq "$RUNNER_TEMP/$GHIDRA_ZIP" -d "$RUNNER_TEMP/ghidra"

          cd "$GITHUB_WORKSPACE/lightkeeper"

          java --version
          gradle --version

          gradle "-PGHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/$GHIDRA_DIR"

          mv -v dist/*.zip \
            "$GITHUB_WORKSPACE/lightkeeper-${{ steps.get_version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Change log:

            ${{ steps.get_version.outputs.CHANGE_LOG }}
          files: ${{ github.workspace }}/lightkeeper-${{ steps.get_version.outputs.VERSION }}.zip
          fail_on_unmatched_files: true